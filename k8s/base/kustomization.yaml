apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# What every deployment needs, whatever routes traffic to it. Apply an overlay (../ingress, ../gloo-edge or ../local),
# which sets the namespace and adds the routing.
resources:
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
