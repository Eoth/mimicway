apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimicway
  labels:
    app.kubernetes.io/name: mimicway
    app.kubernetes.io/component: server
spec:
  # One writer of the configuration file: a second replica, or a rolling update that starts the new pod before the
  # old one stops, would let two processes write the same volume and lose changes. Recreate stops the old pod first
  # (it flushes pending writes on SIGTERM), then starts the new one.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mimicway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mimicway
        app.kubernetes.io/component: server
    spec:
      # Many storage classes create the volume owned by root: fsGroup gives it to the container's group, or the
      # non-root process could not write its configuration there.
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # Mimicway never calls the Kubernetes API: no token in the pod.
      automountServiceAccountToken: false
      containers:
        - name: mimicway
          # Set your registry and version: kustomize edit set image mimicway=<registry>/mimicway:<version>
          image: mimicway
          ports:
            - containerPort: 7342
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: mimicway-config
          volumeMounts:
            - name: data
              mountPath: /data
          # Idle, Mimicway uses a few MiB. A request body is buffered (up to 10 MiB) to evaluate rule conditions, and so
          # is each side of an observed proxy exchange; observation then keeps at most 200 x 8 exchanges of 16 KiB per
          # side. The limit leaves room for that and a few large bodies at once.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mimicway-data
      terminationGracePeriodSeconds: 10
