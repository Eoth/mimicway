[package]
name = "mimicway"
version = "0.1.0"
edition = "2024"
description = "Mock or proxy any HTTP API, rule by rule, from a web UI: one self-contained binary, no telemetry"
license = "MIT"
repository = "https://github.com/Eoth/mimicway"

[dependencies]
# Web framework async
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }

# HTTP client for proxy forwarding
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

# JWT validation (Keycloak auth). Its crypto backend is AWS-LC (aws-lc-rs): the pure-Rust one brings the rsa crate,
# whose RUSTSEC-2023-0071 has no fix. No PEM support: keys come from the realm key set (JWKS).
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }

# Serialization
serde = { version = "1", features = ["derive", "rc"] }
serde_yaml = "0.9"
serde_json = "1"

# XML/SOAP parsing
quick-xml = "0.42"

# Regex (NFA, compiled once)
regex = "1"

# Fast random (no getrandom dependency)
fastrand = "2"

# Tower middleware (CORS, static files)
tower-http = { version = "0.6", features = ["cors", "fs"] }

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID v4 generation
uuid = { version = "1", features = ["v4", "fast-rng"] }

# HTTP types
http = "1"
http-body-util = "0.1"

# Stream adapters (transitive dep, no binary increase)
futures-util = "0.3"

# Lightweight scripting engine (sandboxed, pure Rust)
rhai = { version = "1", features = ["sync"] }

# URL parsing (form_urlencoded for condition extraction)
url = "2"

# Kafka client (consumer and producer), only compiled with the "messaging-kafka" feature. "cmake-build" builds
# librdkafka (C) from source, which needs cmake, a C toolchain and, on Linux, the libcurl headers.
rdkafka = { version = "0.36", features = ["cmake-build"], optional = true }

[dev-dependencies]
# Property-based tests of the code that reads untrusted backend responses (rule suggestions). Pure Rust, runs on
# stable toolchains on every platform, never part of the shipped binary.
proptest = "1"
# Generate signing keys and encode them for the fake Keycloak realm of the authentication tests. Both are already
# in the dependency graph, ring through rustls and base64 through the HTTP stack (same versions), so they add
# nothing to build.
ring = "0.17"
base64 = "0.22"

[features]
# Kafka messaging (consumer, publisher, message log). Off by default: without it, rdkafka is neither downloaded
# nor compiled.
messaging-kafka = ["dep:rdkafka"]

# Raw TCP mocks for simple binary protocols: one message in, fixed bytes out, never a relay (src/tcp/mod.rs says
# why). Off by default: src/tcp/ is not even compiled. No extra dependency: byte matching uses regex::bytes.
tcp-mock = ["tokio/io-util"]

[profile.release]
opt-level = 3
lto = true
strip = true
