# Dependency updates arrive as pull requests, each one going through the CI before anyone merges it.
# Monthly and grouped, so that a month of updates costs a few CI runs: the minor and patch updates of an ecosystem in
# one pull request, each major update in its own (it may need code changes), the actions and the base images in one
# each. A version is proposed a week after its release at the earliest: a compromised release is usually pulled within
# days. Dependabot does not rebase its pull requests when develop moves, since each rebase runs their CI again: comment
# "@dependabot rebase" on the one about to be merged. Security updates are not delayed: they come as soon as an
# advisory is published.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    rebase-strategy: disabled
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Used by the tests only, at the version reqwest, hyper-util and jsonwebtoken already build, so that it adds
      # nothing to compile: its next major comes when theirs does, by hand.
      - dependency-name: base64
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    rebase-strategy: disabled
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    rebase-strategy: disabled
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    # The images of Dockerfile and of the fuzzing builder (.clusterfuzzlite/Dockerfile).
    directories: ["/", "/.clusterfuzzlite"]
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    rebase-strategy: disabled
    groups:
      base-images:
        patterns: ["*"]
