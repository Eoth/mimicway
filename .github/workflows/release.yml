# Publishes a release when a version tag (vX.Y.Z) is pushed: binaries for Linux, macOS and Windows with the UI
# embedded, a multi-architecture image on GHCR, CycloneDX SBOMs and checksums. Every artifact gets a build provenance
# attestation, and the image a keyless cosign signature: SECURITY.md says how to verify them.
# The Dockerfile builds the Linux binaries, with Rust and Node.js pinned by digest and the same paths on every machine.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/eoth/mimicway

jobs:
  check:
    name: Tag, versions and changelog agree
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      rust: ${{ steps.version.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          ui=$(node -p "require('./frontend/package.json').version")
          if [ "$version" != "$crate" ] || [ "$version" != "$ui" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml ($crate) and frontend/package.json ($ui)."
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $version."
            exit 1
          fi
          # The macOS and Windows binaries are built with the Rust of the Linux ones: the Dockerfile's base image, which
          # Dependabot keeps up to date.
          rust=$(sed -n 's/^FROM rust:\([0-9.]*\)-.*/\1/p' Dockerfile)
          if [ -z "$rust" ]; then
            echo "The Dockerfile has no FROM rust:<version>-... line."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

  linux:
    name: Binary (${{ matrix.target }})
    needs: check
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Static (musl) binaries: they run on any distribution and in an image without libc.
      - run: docker build --target binary --output type=local,dest=out .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: out/mimicway

  ui:
    name: UI
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --ignore-scripts && npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui
          path: frontend/dist

  binaries:
    name: Binary (${{ matrix.target }})
    needs: [check, ui]
    strategy:
      matrix:
        include:
          - { target: x86_64-apple-darwin, os: macos-15 }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-pc-windows-msvc, os: windows-2022 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # build.rs embeds the UI found here.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui
          path: frontend/dist
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: ${{ needs.check.outputs.rust }}
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/mimicway${{ contains(matrix.target, 'windows') && '.exe' || '' }}

  archives:
    name: Archives
    needs: [check, linux, binaries]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: binaries
      # Fixed times, order, owners and permissions (see the script): the archive of a binary is always the same.
      - name: Pack each binary with its documents
        run: |
          for dir in binaries/binary-*; do
            target="${dir#binaries/binary-}"
            bash scripts/release-archive.sh "$(find "$dir" -type f)" "$target" "$VERSION" dist
          done
          ls -l dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archives
          path: dist/*

  sbom:
    name: SBOMs
    needs: check
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-cyclonedx@0.5.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Server SBOM (Rust crates of the default build)
        run: |
          mkdir -p dist
          cargo cyclonedx --format json --override-filename "mimicway-$VERSION.cdx"
          mv "mimicway-$VERSION.cdx.json" dist/
      - name: UI SBOM (npm packages that end up in the bundle)
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --output-file "../dist/mimicway-ui-$VERSION.cdx.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: dist/*

  release:
    name: GitHub release
    needs: [check, archives, sbom]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: archives
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Release notes from CHANGELOG.md
        run: awk -v v="[$VERSION]" '/^## \[/ { p = index($0, v) > 0; next } p' CHANGELOG.md > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Mimicway $VERSION" --notes-file notes.md --verify-tag

  image:
    name: Container image
    needs: [check, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The image is made of the released Linux binaries, one per architecture.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-x86_64-unknown-linux-musl
          path: image/linux-amd64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-aarch64-unknown-linux-musl
          path: image/linux-arm64
      - name: Build context
        run: mkdir -p image/data && cp Dockerfile.release image/Dockerfile
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: image
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # A storage record exists for organization repositories only.
          create-storage-record: false
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Sign the image (keyless, with the workflow's identity)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
