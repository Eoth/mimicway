# Every gate a reviewer would otherwise have to run by hand. Each job runs only when a file it checks changes:
# scripts/ci-plan.mjs decides, from the changed files, and "CI passed" fails when a job it planned did not pass. That
# last job is the one check branch protection requires.
# Actions are pinned to commit SHAs (version in the comment): a tag can be moved, a commit cannot. Dependabot proposes
# the updates. Runner images are pinned too: a new image is a change like any other, not a surprise.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    # Weekly, on develop: the advisories published since against lock files that did not change.
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Plan (which jobs the change needs)
    runs-on: ubuntu-24.04
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request is checked out as a merge commit: its first parent is the target branch.
          fetch-depth: 2
          persist-credentials: false
      - id: plan
        run: node scripts/ci-plan.mjs plan
        env:
          BEFORE: ${{ github.event.before }}

  checks:
    name: Documentation, comments and repository checks
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'checks')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Every Markdown link, image and anchor resolves
        run: node scripts/check-doc-links.mjs
      - name: The repository checks fail on the drifts they are meant to catch
        run: node --test scripts/*.test.mjs
      - name: Every page and screenshot exists in English and French, with the same headings and images
        run: node scripts/check-doc-translations.mjs
      - name: Comments and test titles are in English (paths listed in the script)
        run: node scripts/check-french-comments.mjs
      - name: No tracked file names the former design system
        run: node scripts/check-former-design-system.mjs

  secrets:
    name: Secret scan
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'secrets')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rust:
    name: Rust (fmt, clippy, tests)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'rust')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --features tcp-mock --all-targets -- -D warnings
      - run: cargo test
      - run: cargo test --features tcp-mock

  kafka:
    name: Rust with the Kafka feature
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'kafka')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # librdkafka is built from source; on Linux it links libcurl, so it needs the curl headers.
      - run: sudo apt-get update && sudo apt-get install -y cmake libcurl4-openssl-dev
      - run: cargo clippy --features messaging-kafka --all-targets -- -D warnings
      - run: cargo test --features messaging-kafka
      # The Kafka specs of the end-to-end suite skip themselves against a binary without the feature, which is the one
      # the e2e job builds: they run here, against this job's build, or they never run at all.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --ignore-scripts && npm run build && npx playwright install --with-deps chromium
      - run: cargo build --features messaging-kafka
      - name: Start Mimicway with the Kafka feature
        run: |
          mkdir -p data
          DATA_PATH=./data ./target/debug/mimicway > mimicway.log 2>&1 &
          for _ in $(seq 1 50); do
            if curl -sf http://localhost:7342/api/messaging/status | grep -q '"available":true'; then exit 0; fi
            sleep 0.2
          done
          cat mimicway.log; exit 1
      - name: End-to-end Kafka specs
        working-directory: frontend
        run: npx playwright test messaging.spec.js
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-kafka-report
          path: |
            frontend/test-results
            mimicway.log
          if-no-files-found: ignore

  supply-chain:
    name: Supply chain (advisories, licenses, sources)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'supply-chain')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      # cargo deny reads the RustSec database only; OSV also holds the GitHub advisories (a jsonwebtoken one was
      # missing from RustSec), and it is what the OpenSSF Scorecard reads. Exceptions: osv-scanner.toml.
      - name: Known vulnerabilities of every lock file (OSV)
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --recursive
            ./
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: npm audit (production dependencies of the UI)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (build and test tooling)
        working-directory: frontend
        run: npm audit --audit-level=critical

  ui:
    name: UI (unit tests, build)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'ui')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --ignore-scripts
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build

  e2e:
    name: End-to-end (real binary, real browser)
    # After the unit tests, when they run: a failure there stops the costliest job before it starts.
    needs: [changes, rust, ui]
    if: ${{ !cancelled() && !failure() && contains(fromJSON(needs.changes.outputs.jobs), 'e2e') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The UI first, so that build.rs embeds it: the suite then runs against the binary alone, as released.
      - working-directory: frontend
        run: npm ci --ignore-scripts && npm run build && npx playwright install --with-deps chromium
      - run: cargo build
      - name: Start Mimicway (embedded UI, no STATIC_DIR)
        run: |
          mkdir -p data
          DATA_PATH=./data ./target/debug/mimicway > mimicway.log 2>&1 &
          for _ in $(seq 1 50); do curl -sf http://localhost:7342/api/health && exit 0; sleep 0.2; done
          cat mimicway.log; exit 1
      - working-directory: frontend
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: |
            frontend/test-results
            mimicway.log
          if-no-files-found: ignore

  docker:
    name: Container image (build, vulnerability scan)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'docker')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t mimicway:ci .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mimicway:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  kubernetes:
    name: Kubernetes manifests (render, schema check)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'kubernetes')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tgz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  kubeconform.tgz" | sha256sum -c -
          tar xzf kubeconform.tgz kubeconform
      - name: Render and validate every overlay
        # Custom resources (Gloo Edge) have no published schema: they are rendered, not validated.
        run: |
          for overlay in k8s/ingress k8s/gloo-edge; do
            kubectl kustomize "$overlay" | ./kubeconform -strict -summary -ignore-missing-schemas -
          done

  workflows:
    name: Workflows (actionlint, shellcheck)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'workflows')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Checks every workflow, including the release one that only runs on tags, and the shell steps through the
      # runner's shellcheck.
      - name: Lint the workflows
        run: |
          curl -sSLo actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tgz" | sha256sum -c -
          tar xzf actionlint.tgz actionlint
          ./actionlint -color

  ci-passed:
    name: CI passed
    needs:
      - changes
      - checks
      - secrets
      - rust
      - kafka
      - supply-chain
      - ui
      - e2e
      - docker
      - kubernetes
      - workflows
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Every planned job passed
        run: node scripts/ci-plan.mjs verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
          PLANNED: ${{ needs.changes.outputs.jobs }}
