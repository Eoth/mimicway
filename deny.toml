# Supply-chain policy, enforced in CI with `cargo deny check`: known vulnerabilities and yanked versions fail the
# build, every dependency comes from crates.io, and every license is permissive. MPL-2.0 (smartstring, through
# rhai) is file-level copyleft: the MIT-licensed binary can ship it unmodified, its sources staying on crates.io.

[graph]
# Optional features included, so that the Kafka dependencies are held to the same policy.
all-features = true

[advisories]
version = 2
yanked = "deny"
# Each exception says when to look at it again ("review by", at most six months ahead), and so does its twin in
# osv-scanner.toml: scripts/check-exception-dates.mjs fails the CI once the date is reached.
ignore = [
    # smartstring is unmaintained (no known vulnerability). It is an internal detail of rhai, the script engine,
    # whose latest release still depends on it; to be dropped when rhai moves away from it (see ROADMAP.md).
    { id = "RUSTSEC-2026-0249", reason = "unmaintained, no vulnerability, internal to rhai with no alternative release; review by 2027-04-30" },
    # unsafe-libyaml is unmaintained (no known vulnerability). serde_yaml brings it, and only reads the configuration
    # file Mimicway writes itself (imports go through JSON); to be dropped with serde_yaml (see ROADMAP.md).
    { id = "RUSTSEC-2024-0449", reason = "unmaintained, no vulnerability, brought by serde_yaml, which only reads Mimicway's own configuration file; review by 2027-04-30" },
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
